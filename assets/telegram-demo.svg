<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Microbot Telegram conversation preview</title>
  <desc id="desc">A dark Telegram-style conversation demonstrating microbot's reset command and AI reply.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1724"/>
      <stop offset="1" stop-color="#172a3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <circle cx="1060" cy="92" r="170" fill="#159e7c" opacity=".13"/>
  <circle cx="120" cy="670" r="190" fill="#4b8bff" opacity=".13"/>
