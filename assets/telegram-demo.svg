  <text x="470" y="548" font-family="Inter, Arial, sans-serif" font-size="17" fill="#f4f7fa">کلودفلیر است که microbot برای</text>
  <text x="470" y="574" font-family="Inter, Arial, sans-serif" font-size="17" fill="#f4f7fa">حافظهٔ محدود گفتگو استفاده می‌کند.</text>
  <text x="846" y="580" font-family="Inter, Arial, sans-serif" font-size="12" fill="#93a7b5">10:43</text>
