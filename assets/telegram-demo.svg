  <text x="342" y="426" font-family="Inter, Arial, sans-serif" font-size="18" fill="#fff">یک توضیح کوتاه دربارهٔ D1 بده</text>
  <text x="656" y="447" font-family="Inter, Arial, sans-serif" font-size="12" fill="#c7d9e8">10:43 ✓✓</text>
